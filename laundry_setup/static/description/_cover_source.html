<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background-color:#0d2b5e;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .cover {
    width:1200px; height:630px;
    background-color:#0d2b5e;
    position:relative;
    padding:56px 72px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .top-bar {
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
  }
  .top-bar img {
    height:48px;
  }
  .center {
    display:flex;
    align-items:center;
    gap:48px;
    flex:1;
    padding:40px 0 24px;
  }
  .module-icon {
    width:180px;
    height:180px;
    border-radius:28px;
    flex-shrink:0;
  }
  .text-block h1 {
    color:#ffffff;
    font-size:64px;
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1.1;
    margin-bottom:20px;
  }
  .text-block p {
    color:#a8c8f8;
    font-size:22px;
    line-height:1.6;
    font-weight:400;
  }
  .bottom-line {
    height:4px;
    background-color:#00c5d7;
    border-radius:2px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="top-bar">
    <img src="lidsus.png" alt="LeadSolutions"/>
  </div>
  <div class="center">
    <img src="icon.png" alt="Laundry Setup" class="module-icon"/>
    <div class="text-block">
      <h1>Laundry Setup</h1>
      <p>Complete laundry management system for Odoo 18<br/>
         Configuration, workflows, and service order management</p>
    </div>
  </div>
  <div class="bottom-line"></div>
</div>
</body>
</html>
